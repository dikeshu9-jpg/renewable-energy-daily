<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renewable Energy Daily</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#eef2f5;
    color:#222;
}

header{
    background:#009245;
    color:white;
    padding:24px;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
}

header h1{
    font-size:30px;
}

header p{
    margin-top:6px;
    opacity:.9;
}

.container{
    padding:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.card h2{
    margin-bottom:12px;
}

.news{
    padding:12px;
    background:#f6f6f6;
    border-radius:12px;
    margin-top:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.menu{
    background:white;
    border-radius:16px;
    padding:16px;
    text-align:center;
    font-size:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.market{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.value{
    font-size:22px;
    font-weight:bold;
    color:#009245;
}

.footer{
    text-align:center;
    color:#777;
    padding:30px;
}
</style>

</head>

<body>

<header>

<h1>☀️ Renewable Energy Daily</h1>

<p>あなた専用 再エネダッシュボード</p>

</header>

<div class="container">

<h2>🔥 今日の重要ニュース</h2>

<div class="news">

<br><br>

サイト制作中です

</div>

<div class="news">

★★★★☆

<br><br>

ニュース取得機能を追加予定

</div>

</div>

<div class="grid">

<div class="menu">☀️<br>太陽光</div>

<div class="menu">🔋<br>蓄電池</div>

<div class="menu">⚡<br>JEPX</div>

<div class="menu">🏛<br>政策</div>

<div class="menu">💰<br>ファイナンス</div>

<div class="menu">🌍<br>海外</div>

</div>

<br>

<div class="card">

<h2>📈 マーケット</h2>

<div class="market">

<div>

ドル円

<div class="value">---</div>

</div>

<div>

長期金利

<div class="value">---</div>

</div>

<div>

JEPX

<div class="value">---</div>

</div>

</div>

</div>

<div class="card">

<h2>🤖 AIコメント</h2>

<p>

今日読むべきニュースをAIが表示します。

</p>

</div>

</div>

<div class="footer">

Renewable Energy Daily v2

</div>

</body>
</html>
