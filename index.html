<!DOCTYPE html>

<head>

  padding:4px 8px;

  margin-right:6px;
}
</style>
</head>

<body>

<h1>☀️ Renewable Energy Daily</h1>

<div class="card">
<h2>今日の重要ニュース</h2>
<p>🚧 サイト制作中です！</p>
</div>

<div class="card">
<span class="tag">太陽光</span>

</body>
</html>
